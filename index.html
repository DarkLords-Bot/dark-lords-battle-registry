<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Dark Lords Registry</title><script src="https://cdn.tailwindcss.com"></script></head><body class="bg-[#0a0d14] text-white p-3">
<div class="max-w-2xl mx-auto">
<header class="bg-[#151a26] p-4 rounded-2xl flex justify-between items-center mb-3"><div><p class="font-bold text-sm">⚔️ DARK LORDS BATTLE REGISTRY</p><p class="text-[10px] text-gray-400">Submit directly to Admin</p></div><div id="liveStatus" class="text-[10px] text-green-400">● Online</div></header>

<div class="bg-[#1b2130] rounded-2xl p-4 space-y-3">
<div class="grid grid-cols-2 gap-2">
<input id="pName" placeholder="Player Name *" class="bg-[#2a3448] p-3 rounded-xl text-xs">
<input id="pId" placeholder="Player ID *" class="bg-[#2a3448] p-3 rounded-xl text-xs">
</div>
<div class="grid grid-cols-2 gap-2">
<input id="alliance" placeholder="Alliance" class="bg-[#2a3448] p-3 rounded-xl text-xs">
<input id="totalPower" placeholder="Total Power (M)" class="bg-[#2a3448] p-3 rounded-xl text-xs">
</div>
<div class="grid grid-cols-3 gap-2">
<input id="heroPower" placeholder="Hero Power" class="bg-[#2a3448] p-2 rounded-xl text-[11px]">
<input id="tcLevel" placeholder="TC Level" class="bg-[#2a3448] p-2 rounded-xl text-[11px]">
<input id="ccLevel" placeholder="CC Level" class="bg-[#2a3448] p-2 rounded-xl text-[11px]">
</div>

<p class="text-[11px] font-bold text-purple-400 mt-2">Heroes & Gear</p>
<div class="grid grid-cols-3 gap-2 text-[11px]">
<input id="infHero" placeholder="Inf Hero" class="bg-[#252e42] p-2 rounded-lg">
<input id="infSkill" placeholder="Skill" class="bg-[#252e42] p-2 rounded-lg">
<input id="infGear" placeholder="Gear" class="bg-[#252e42] p-2 rounded-lg">
<input id="cavHero" placeholder="Cav Hero" class="bg-[#252e42] p-2 rounded-lg">
<input id="cavSkill" placeholder="Skill" class="bg-[#252e42] p-2 rounded-lg">
<input id="cavGear" placeholder="Gear" class="bg-[#252e42] p-2 rounded-lg">
<input id="arcHero" placeholder="Arc Hero" class="bg-[#252e42] p-2 rounded-lg">
<input id="arcSkill" placeholder="Skill" class="bg-[#252e42] p-2 rounded-lg">
<input id="arcGear" placeholder="Gear" class="bg-[#252e42] p-2 rounded-lg">
</div>

<p class="text-[11px] font-bold text-yellow-400">Experience Skill 5 Heroes</p>
<div id="expContainer" class="flex flex-wrap gap-2"></div>
<button onclick="addExp()" class="bg-zinc-700 px-3 py-1 rounded-full text-[10px]">+ Add Hero</button>

<p class="text-[11px] font-bold text-blue-400">Troops Quantity & Level</p>
<div class="grid grid-cols-2 gap-2 text-[11px]">
<input id="infQty" placeholder="Inf Qty (e.g. 200k)" class="bg-[#252e42] p-2 rounded-lg">
<input id="infLvl" placeholder="Inf Level (T10)" class="bg-[#252e42] p-2 rounded-lg">
<input id="cavQty" placeholder="Cav Qty" class="bg-[#252e42] p-2 rounded-lg">
<input id="cavLvl" placeholder="Cav Level" class="bg-[#252e42] p-2 rounded-lg">
<input id="arcQty" placeholder="Arc Qty" class="bg-[#252e42] p-2 rounded-lg">
<input id="arcLvl" placeholder="Arc Level" class="bg-[#252e42] p-2 rounded-lg">
</div>

<button onclick="submitPlayer()" class="w-full mt-4 bg-gradient-to-r from-purple-600 to-blue-600 py-3 rounded-xl font-bold text-sm">✅ Submit - Admin Will See Directly</button>
<p class="text-[9px] text-center text-gray-500">No code needed. Just submit.</p>
</div>
</div>
<div id="toast" class="fixed bottom-5 left-1/2 -translate-x-1/2 bg-white text-black px-6 py-3 rounded-full text-xs font-bold hidden"></div>
<script>
const DB_URL="https://dark-lords-registry-default-rtdb.firebaseio.com";
let expCount=4, expOpts=['Howard','Gordan','Saul','Hilde','Chenko','Amane','Yenwoo','Others'];
function renderExp(){const c=document.getElementById('expContainer');c.innerHTML='';for(let i=0;i<expCount;i++){const s=document.createElement('select');s.id='exp_'+i;s.className='bg-[#1b2130] border border-zinc-700 rounded-lg px-2 py-1.5 text-[11px]';s.innerHTML='<option value="">Select</option>'+expOpts.map(o=>`<option>${o}</option>`).join('');c.appendChild(s);}}
function addExp(){expCount++;renderExp();} renderExp();
async function submitPlayer(){
 const d={name:document.getElementById('pName').value.trim(),id:document.getElementById('pId').value.trim(),alliance:document.getElementById('alliance').value.trim(),totalPower:document.getElementById('totalPower').value.trim(),heroPower:document.getElementById('heroPower').value.trim(),tc:document.getElementById('tcLevel').value.trim(),cc:document.getElementById('ccLevel').value.trim(),infHero:document.getElementById('infHero').value.trim(),infSkill:document.getElementById('infSkill').value.trim(),infGear:document.getElementById('infGear').value.trim(),cavHero:document.getElementById('cavHero').value.trim(),cavSkill:document.getElementById('cavSkill').value.trim(),cavGear:document.getElementById('cavGear').value.trim(),arcHero:document.getElementById('arcHero').value.trim(),arcSkill:document.getElementById('arcSkill').value.trim(),arcGear:document.getElementById('arcGear').value.trim(),exp:[],infQty:document.getElementById('infQty').value.trim(),infLvl:document.getElementById('infLvl').value.trim(),cavQty:document.getElementById('cavQty').value.trim(),cavLvl:document.getElementById('cavLvl').value.trim(),arcQty:document.getElementById('arcQty').value.trim(),arcLvl:document.getElementById('arcLvl').value.trim(),time:new Date().toLocaleString()};
 if(!d.name||!d.id){alert('Name and ID required');return;}
 for(let i=0;i<expCount;i++){const v=document.getElementById('exp_'+i)?.value;if(v)d.exp.push(v);}
 document.getElementById('liveStatus').innerText='⏳ Sending...';
 try{await fetch(`${DB_URL}/players/${d.id}.json`,{method:'PUT',body:JSON.stringify(d)});toast('✅ Submitted! Admin sees: '+d.name+' ID:'+d.id);document.getElementById('liveStatus').innerText='● Submitted';}catch(e){toast('❌ Failed - check Firebase rules');document.getElementById('liveStatus').innerText='● Offline';}
}
function toast(m){const e=document.getElementById('toast');e.innerText=m;e.classList.remove('hidden');setTimeout(()=>e.classList.add('hidden'),3500);}
</script></body></html>
