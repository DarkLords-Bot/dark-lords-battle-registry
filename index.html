<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Dark Lords - Join Form</title><script src="https://cdn.tailwindcss.com"></script></head><body class="bg-[#0a0d14] text-white min-h-screen p-4">
<div class="max-w-2xl mx-auto bg-[#1b2130] rounded-2xl p-5 border border-zinc-800"><h2 class="font-bold">📝 Dark Lords - Player Submission</h2><p class="text-[10px] text-gray-400">Fill form → Submit → Send code to Admin on WhatsApp. Reset for next battle if needed.</p>
<div class="grid grid-cols-2 gap-3 mt-4">
<input id="pName" placeholder="Player Name *" class="bg-[#2a3448] rounded-xl px-3 py-2.5 text-xs"><input id="pId" placeholder="Player ID *" class="bg-[#2a3448] rounded-xl px-3 py-2.5 text-xs">
<input id="alliance" placeholder="Alliance Name *" class="bg-[#2a3448] rounded-xl px-3 py-2.5 text-xs"><input id="totalPower" type="number" placeholder="Total Power M" class="bg-[#2a3448] rounded-xl px-3 py-2.5 text-xs">
<input id="heroPower" type="number" placeholder="Hero Power" class="bg-[#2a3448] rounded-xl px-3 py-2.5 text-xs"><select id="tcLevel" class="bg-[#2a3448] rounded-xl px-3 py-2.5 text-xs"><option>< TC30</option><option>TG1</option><option>TG2</option><option>TG3</option><option>TG4</option><option>TG5</option></select>
<select id="ccLevel" class="bg-[#2a3448] rounded-xl px-3 py-2.5 text-xs"><option>< TC30</option><option>TG1</option><option>TG2</option><option>TG3</option><option>TG4</option><option>TG5</option></select>
</div>
<div class="grid grid-cols-3 gap-2 mt-4">
<div class="bg-[#252e42] p-2 rounded-xl"><p class="text-[10px] font-bold text-red-400">Infantry</p><select id="infHero" class="w-full mt-1 bg-[#1b2130] rounded px-2 py-1.5 text-xs"><option value="">Hero</option><option>Amadeus</option><option>Zoe</option><option>Eric</option><option>Howard</option></select><div class="grid grid-cols-2 gap-1 mt-1"><select id="infSkill" class="bg-[#1b2130] rounded px-1 py-1 text-[10px]"><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option></select><select id="infGear" class="bg-[#1b2130] rounded px-1 py-1 text-[10px]"><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option><option>6</option><option>7</option><option>8</option><option>9</option><option>10</option></select></div></div>
<div class="bg-[#252e42] p-2 rounded-xl"><p class="text-[10px] font-bold text-yellow-400">Cavalry</p><select id="cavHero" class="w-full mt-1 bg-[#1b2130] rounded px-2 py-1.5 text-xs"><option value="">Hero</option><option>Jabel</option><option>Hilde</option><option>Petra</option></select><div class="grid grid-cols-2 gap-1 mt-1"><select id="cavSkill" class="bg-[#1b2130] rounded px-1 py-1 text-[10px]"><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option></select><select id="cavGear" class="bg-[#1b2130] rounded px-1 py-1 text-[10px]"><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option><option>6</option><option>7</option><option>8</option><option>9</option><option>10</option></select></div></div>
<div class="bg-[#252e42] p-2 rounded-xl"><p class="text-[10px] font-bold text-blue-400">Archer</p><select id="arcHero" class="w-full mt-1 bg-[#1b2130] rounded px-2 py-1.5 text-xs"><option value="">Hero</option><option>Saul</option><option>Marlin</option><option>Jaeger</option></select><div class="grid grid-cols-2 gap-1 mt-1"><select id="arcSkill" class="bg-[#1b2130] rounded px-1 py-1 text-[10px]"><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option></select><select id="arcGear" class="bg-[#1b2130] rounded px-1 py-1 text-[10px]"><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option><option>6</option><option>7</option><option>8</option><option>9</option><option>10</option></select></div></div>
</div>
<div class="mt-3 bg-[#252e42] p-2 rounded-xl"><p class="text-[10px] font-bold">Exp Skill 5 Heroes</p><div class="flex flex-wrap gap-1 mt-1" id="expBox"></div></div>
<div class="grid grid-cols-3 gap-2 mt-3">
<div><input id="infQty" type="number" placeholder="Inf Qty" class="w-full bg-[#2a3448] rounded px-2 py-2 text-xs"><select id="infLvl" class="w-full mt-1 bg-[#1b2130] rounded px-2 py-1 text-xs"><option>< TC30</option><option>TG1</option><option>TG2</option><option>TG3</option><option>TG4</option><option>TG5</option></select></div>
<div><input id="cavQty" type="number" placeholder="Cav Qty" class="w-full bg-[#2a3448] rounded px-2 py-2 text-xs"><select id="cavLvl" class="w-full mt-1 bg-[#1b2130] rounded px-2 py-1 text-xs"><option>< TC30</option><option>TG1</option><option>TG2</option><option>TG3</option><option>TG4</option><option>TG5</option></select></div>
<div><input id="arcQty" type="number" placeholder="Arc Qty" class="w-full bg-[#2a3448] rounded px-2 py-2 text-xs"><select id="arcLvl" class="w-full mt-1 bg-[#1b2130] rounded px-2 py-1 text-xs"><option>< TC30</option><option>TG1</option><option>TG2</option><option>TG3</option><option>TG4</option><option>TG5</option></select></div>
</div>
<div class="flex gap-2 mt-4"><button onclick="submitForm()" class="bg-purple-600 flex-1 py-3 rounded-xl font-bold text-sm">✅ Submit & Generate Code</button><button onclick="resetForm()" class="bg-zinc-700 px-5 py-3 rounded-xl font-bold text-sm">🔄 Reset</button></div>
<div id="codeBox" class="hidden mt-4 bg-[#252e42] p-3 rounded-xl"><p class="text-[11px] font-bold text-green-400">✅ Copy this code and send to Admin on WhatsApp:</p><textarea id="outCode" class="w-full mt-2 bg-[#0a0d14] rounded p-2 text-[9px] h-20"></textarea><button onclick="copyCode()" class="mt-2 bg-[#25D366] text-black px-4 py-2 rounded-lg text-xs font-bold w-full">📲 Copy & Open WhatsApp</button></div>
</div>
<script>
let exps=[], opts=['Howard','Gordan','Saul','Hilde','Chenko','Amane','Yenwoo'];
function renderExp(){document.getElementById('expBox').innerHTML=opts.map(o=>`<button onclick="toggleExp('${o}')" class="text-[9px] px-2 py-1 rounded-full border ${exps.includes(o)?'bg-purple-600 border-purple-400':'bg-[#1b2130] border-zinc-700'}">${o}</button>`).join('');}
function toggleExp(o){if(exps.includes(o))exps=exps.filter(x=>x!==o);else exps.push(o);renderExp();}renderExp();
function submitForm(){const data={name:document.getElementById('pName').value.trim(),id:document.getElementById('pId').value.trim(),alliance:document.getElementById('alliance').value.trim(),totalPower:document.getElementById('totalPower').value,heroPower:document.getElementById('heroPower').value,tc:document.getElementById('tcLevel').value,cc:document.getElementById('ccLevel').value,infHero:document.getElementById('infHero').value,infSkill:document.getElementById('infSkill').value,infGear:document.getElementById('infGear').value,cavHero:document.getElementById('cavHero').value,cavSkill:document.getElementById('cavSkill').value,cavGear:document.getElementById('cavGear').value,arcHero:document.getElementById('arcHero').value,arcSkill:document.getElementById('arcSkill').value,arcGear:document.getElementById('arcGear').value,exp:exps,infQty:document.getElementById('infQty').value,infLvl:document.getElementById('infLvl').value,cavQty:document.getElementById('cavQty').value,cavLvl:document.getElementById('cavLvl').value,arcQty:document.getElementById('arcQty').value,arcLvl:document.getElementById('arcLvl').value};if(!data.name||!data.id||!data.alliance){alert('Name, ID, Alliance required');return;}const code=btoa(JSON.stringify(data));document.getElementById('outCode').value=code;document.getElementById('codeBox').classList.remove('hidden');window.lastCode=code;window.lastName=data.name;}
function copyCode(){navigator.clipboard.writeText(window.lastCode).then(()=>{const wa=`https://wa.me/?text=${encodeURIComponent('Dark Lords Join - '+window.lastName+' Code: '+window.lastCode)}`;window.open(wa,'_blank');});}
function resetForm(){if(!confirm('Reset form for next battle?'))return;document.querySelectorAll('input').forEach(i=>i.value='');document.querySelectorAll('select').forEach(s=>s.selectedIndex=0);exps=[];renderExp();document.getElementById('codeBox').classList.add('hidden');}
</script></body></html>
